    <main>
      <div class="sidebar">
        <div class="sidebar-heading">
          <div class="app-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M12 2 1 7.5 12 13 23 7.5 12 2Z" />
              <path d="M1 12.5 12 18l11-5.5-2-1-9 4.5-9-4.5-2 1Z" />
              <path d="M1 17.5 12 23l11-5.5-2-1-9 4.5-9-4.5-2 1Z" />
            </svg>
          </div>
          <div class="app-name-details">
            <h2>FinTrack Pro</h2>
            <p>Enterprise Finance</p>
          </div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-navigate">
            <div class="dashboard">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
              </svg>
              <h3>Dashboard</h3>
            </div>
            <div class="settings">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
                <circle cx="12" cy="12" r="3" />
                <circle cx="12" cy="12" r="8" />
              </svg>
              <h3>Settings</h3>
            </div>
          </div>
          <button class="add-transaction"><h3>Add Transaction</h3></button>
        </div>
      </div>
      <div class="content">
        <div class="content-nav">
          <div class="nav-part-1">
            <div class="line"></div>
            <h3>user-name</h3>
          </div>
          <button class="logout-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <h3>Logout</h3>
          </button>
        </div>
        <div class="content-main">
            
          <div class="heading">
            <h2>Financial Overview</h2>
            <p>Real-time tracking application</p>
          </div>

          <div class="transaction-cards">
            <div class="card-one">
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <path d="M3 22h18" />
                  <path d="M6 18V9" />
                  <path d="M10 18V9" />
                  <path d="M14 18V9" />
                  <path d="M18 18V9" />
                  <path d="M2 9h20" />
                  <path d="M12 2 2 7h20L12 2z" />
                </svg>
              </div>
              <div class="card-one-dets">
                <h4>Current Balance</h4>
                <p>$123213312321</p>
              </div>
            </div>

            <div class="card-two">
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                  <polyline points="16 7 22 7 22 13" />
                </svg>
              </div>
              <div class="card-two-dets">
                <h4>Total Income</h4>
                <p>$123213312321</p>
              </div>
            </div>

            <div class="card-three">
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
                  <polyline points="16 17 22 17 22 11" />
                </svg>
              </div>
              <div class="card-three-dets">
                <h4>Total Expense</h4>
                <p>$123213312321</p>
              </div>
            </div>

            <div class="card-four">
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M19 5c-1.5 0-2.8.6-3.8 1.6A8 8 0 0 0 4 12c0 4.4 3.6 8 8 8h5"
                  />
                  <path d="M2 12h2" />
                  <path d="M16 11h.01" />
                  <path d="M20 10c1 0 2 .8 2 2s-1 2-2 2" />
                  <path d="M13 4h2" />
                  <path d="M18 19v2" />
                  <path d="M8 20v2" />
                </svg>
              </div>
              <div class="card-four-dets">
                <h4>Total Transaction</h4>
                <p>$123213312321</p>
              </div>
            </div>
          </div>

        </div>
      </div>
